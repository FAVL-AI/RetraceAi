; Alembic configuration for the RETRACE tenancy schema (RX-47, RX-48, RX-49).
;
; THERE IS NO `sqlalchemy.url` HERE, AND THAT IS DELIBERATE.
;
; Two reasons, both of which have bitten real projects:
;
;   1. A URL committed to an ini file is a credential in version control, or - if
;      the password is left out - a URL that silently points at the wrong
;      database when run from the wrong machine. `alembic upgrade head` against
;      an unintended database is not undone by running it again.
;   2. ConfigParser applies `%` interpolation to option values, so a password
;      containing `%` is corrupted before the driver ever sees it. The symptom is
;      an authentication failure, which sends the reader looking at the server.
;
; The URL is therefore resolved by `retrace_api/db/migrations/env.py` from
; `config.attributes` or from the environment, and no resolution means
; `MigrationConfigurationError` rather than a default.
;
; IDENTITY. These commands run as the SCHEMA-OWNING MIGRATION identity
; (`RETRACE_MIGRATION_USER`), not as the runtime service role and not as the
; privileged bootstrap role. See services/api/MIGRATIONS.md.
;
; Preferred entry point is the programmatic driver, which needs no ini file:
;   python -m retrace_api.db.migrate upgrade
; This file exists so the ordinary `alembic` CLI also works from services/api:
;   cd services/api && alembic upgrade head

[alembic]
script_location = retrace_api/db/migrations
prepend_sys_path = .
; Revision ids are written by hand as ordered, readable identifiers
; (`0001_tenancy_baseline`), so the template contributes only the slug.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
