[project]
name = "retrace"
version = "0.0.0"
description = "RETRACE AI - scientific workflow repair and verification workbench"
authors = [{ name = "Frank Asante Van Laarhoven", email = "frankleroyvan@gmail.com" }]
# 3.12 is the real floor, not 3.11. services/runner uses os.unshare +
# CLONE_NEWNET/CLONE_NEWUSER for the runner's private network namespace, and
# os.unshare was added in CPython 3.12. The runner degrades safely on 3.11 (the
# support probe reports the missing attribute and the run is REFUSED rather than
# executed unisolated), but refusing every isolated run is not "supported", so
# declaring >=3.11 overstated what works. Raised to match reality (RX-08).
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "jsonschema>=4.23",
  "python-multipart>=0.0.18",
  "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Multi-root monorepo: each source root is searched. Verified by the clean-install
# smoke test in docs/evidence/PACKAGING.md - a build that ships 0 modules is a FAILURE.
where = ["packages/contracts", "packages/domain", "packages/i18n",
         "services/api", "services/runner", "services/verifier"]
# `packages/i18n/tools/` holds dev scripts run by path, never imported. Because
# packages/i18n is a discovery root, setuptools would publish them as a
# TOP-LEVEL package literally named `tools`, which is both wrong (build tooling
# is not runtime API) and dangerous (a generic name that collides with anything
# else called `tools` in site-packages). Guarded by a test.
exclude = ["tools*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/contracts", "packages/domain", "packages/i18n", "services/api", "services/runner", "services/verifier"]
addopts = "-q --strict-markers"
markers = ["integration: requires containers", "slow: long running"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = [
  "S101",   # assert is the idiom in the test suite
  # UP042 (str,Enum -> StrEnum) is NOT applied: StrEnum changes str(member) from
  # "Class.MEMBER" to the bare value. Canonical serialisation and therefore every
  # contract/approval digest depends on enum rendering, so this is a behaviour
  # change disguised as a style fix. Revisit only with a digest-stability test.
  "UP042",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "packages/contracts:packages/domain:packages/i18n:services/api:services/runner:services/verifier"
strict = false
warn_unused_ignores = true
